[project]
name = "learnage"
version = "0.1.0"
description = "Local-first book interviewer that remembers what it read"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anne Marie Lee", email = "sol-ai@agentmail.to" }]
dependencies = [
    "httpx>=0.27",
    "pypdf>=5.0",
    "cryptography>=3.1",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "python-docx>=1.1",
    "chromadb>=0.5",
    "pyyaml>=6.0",
    "rich>=13.7",
    "textual>=0.86",
    "pyside6>=6.11.2",
    "pillow>=12.3.0",
    "fonttools>=4.65.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
learnage = "learnage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["learnage"]

[tool.hatch.build.targets.wheel.force-include]
"presets" = "learnage/presets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: tests that hit a real Ollama instance (skip without LEARNAGE_LIVE=1)",
]

[tool.uv]
package = true
